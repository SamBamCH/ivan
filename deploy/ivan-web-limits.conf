# /etc/systemd/system/ivan-web.service.d/limits.conf (deploy/install_limits.sh)
# A ceiling on the web app and every job it starts (they share the unit's cgroup): past MemoryHigh the kernel squeezes them,
# at MemoryMax the unit is killed and Restart=always brings the UI back, instead of the whole server freezing.
[Service]
MemoryHigh=65%
MemoryMax=80%
MemorySwapMax=0
TasksMax=512
CPUWeight=50
