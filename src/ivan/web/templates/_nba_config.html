{# the config section: every knob the pipeline buttons send (#pipe-config; hx-include on the actions bar). Seeded from
   config/nba.json, kept for the desk in data/nba/jobs/desk_config.json by the jobs. #}
<details class="hist-box cfg-box" id="config"><summary>Config <span class="muted">generate · sim · choose knobs, sent with every action</span></summary>
  <form id="pipe-config" class="pipe-form" onsubmit="return false">
    <input type="hidden" name="cfg" value="1">
    <div class="pipe-row pipe-sec {% if not ready.generate %}off{% endif %}" title="{% if not ready.generate %}opens once a slate is loaded and projected{% endif %}">
      <span class="sec">generate</span>
      <label title="ticked: the pool starts empty. Unticked: the new lineups join the existing pool (build a second scenario's lineups beside the first; the sim scores them all under whatever is published)"><input type="checkbox" name="fresh" value="on" {% if form.fresh %}checked{% endif %}> fresh pool</label>
      <label>lineups <input name="lineups" value="{{ form.lineups }}" size="6"></label>
      <label title="parallel solver processes, at most 8">jobs <input name="jobs" value="{{ form.jobs }}" size="2" type="number" min="1" max="8"></label>
      <label title="every lineup must spend at least this">min salary <input name="min_salary" value="{{ form.min_salary }}" size="5"></label>
      <label title="at most this much salary on one team's players">max salary / team <input name="max_salary_per_team" value="{{ form.max_salary_per_team }}" size="5"></label>
      <label title="spread of the sampled worlds the lineups are optimised in, 0-1; lower = closer to the optimal">randomness <input name="randomness" value="{{ form.randomness }}" size="4"></label>
      <label title="every lineup must project at least this share of the mean-optimal lineup">min fpts frac <input name="min_fpts_frac" value="{{ form.min_fpts_frac }}" size="4"></label>
      <label title="players projected below this are left out of the solver's pool">player min fpts <input name="player_min_fpts" value="{{ form.player_min_fpts }}" size="3"></label>
    </div>
    <div class="pipe-row pipe-sec {% if not ready.sim %}off{% endif %}" title="{% if not ready.sim %}opens once the pool is generated{% endif %}">
      <span class="sec">sim</span>
      <label title="simulated worlds per contest">sims <input name="sims" value="{{ form.sims }}" size="5"></label>
      <label title="largest field size simulated; bigger contests are scaled down to it">field cap <input name="field_cap" value="{{ form.field_cap }}" size="6"></label>
    </div>
    <div class="pipe-row pipe-sec {% if not ready.choose %}off{% endif %}" title="{% if not ready.choose %}opens once the sim has run{% endif %}">
      <span class="sec">choose</span>
      <label>method <select name="method" onchange="var f=this.form; f.querySelectorAll('.only-greedy').forEach(function(x){x.style.display=this.value==='greedy'?'':'none'}.bind(this)); f.querySelectorAll('.only-portfolio').forEach(function(x){x.style.display=this.value==='portfolio'?'':'none'}.bind(this))" title="greedy: best quality first, then quality plus a diversity bonus. portfolio: the set that maximises the log-utility of the bankroll over the simulated worlds"><option value="greedy" {% if form.method == 'greedy' %}selected{% endif %}>greedy</option><option value="portfolio" {% if form.method == 'portfolio' %}selected{% endif %}>portfolio</option></select></label>
      <label class="only-greedy" {% if form.method == 'portfolio' %}style="display:none"{% endif %} title="weight on a lineup's cash rate in its quality score">cash weight <input name="cash_pct" value="{{ form.cash_pct }}" size="3"></label>
      <label class="only-greedy" {% if form.method == 'portfolio' %}style="display:none"{% endif %} title="weight on a lineup's mean ROI in its quality score">roi weight <input name="avg_roi_win" value="{{ form.avg_roi_win }}" size="3"></label>
      <label class="only-greedy" {% if form.method == 'portfolio' %}style="display:none"{% endif %} title="how much a pick is rewarded for being unlike the picks so far (0 = none)">diversity <input name="diversity_lambda" value="{{ form.diversity_lambda }}" size="3" {% if form.jam %}disabled{% endif %}></label>
      <label class="only-greedy" {% if form.method == 'portfolio' %}style="display:none"{% endif %} title="take the top lineups by quality in order, no diversity between them"><input type="checkbox" name="jam" {% if form.jam %}checked{% endif %} onchange="this.form.querySelector('[name=diversity_lambda]').disabled = this.checked"> jam the best</label>
      <label class="only-portfolio" {% if form.method != 'portfolio' %}style="display:none"{% endif %} title="utility scale in multiples of the entry fees: lower = more risk-averse picks">bankroll <input name="bankroll" value="{{ form.bankroll }}" size="3"></label>
    </div>
  </form>
</details>
